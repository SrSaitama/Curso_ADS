<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfólio Online</title>
    <link rel="stylesheet" href="src/styles/styles.css">
</head>

<body>
    <header>
        <nav class="navbar">

            <div class="logo">Portfólio de Bruno</div>

            <ul class="nav-links">
                <li><a href="index.html">Sobre</a></li>
                <li><a href="formacao.html">Formação</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
            <button id="btn-tema" class="btn-tema">🌓 Tema</button>

        </nav>
    </header>

    <main class="container">
        <section class="contato">
            <h1>Entre em Contato</h1>
            <p>Preencha o formulário e me mande uma mensagem.</p>

            <!--Criação de um formulário-->
            <form id="formContato" class="form-estilo">
                <div class="form-grupo">
                    <label for="nome">Nome Completo: </label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </div>

                <div class="form-grupo">
                    <label for="email">Seu email: </label>
                    <input type="email" id="email" placeholder="exemplo@dominio.com">
                </div>

                <div class="form-grupo">
                    <label for="mensagem">Sua mensagem: </label>
                    <textarea id="mensagem" rows="6" placeholder="Escreva sua mensagem aqui.."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 UNINTER. Bruno Eliakim. Todos os direitos reservados.</p>
    </footer>

    <script src="src/javascript/tema.js"></script>
    <script src="src/javascript/javascript.js"></script>
</body>

</html>
