<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Portfólio - Contato</title>
    <link rel="stylesheet" href="src/css/styles.css">
</head>
<body>
     <!--Barra superior -->
    <header>
        <nav class="navbar">
            <div class="logo">Portfólio de [Seu Nome Completo]</div>
            <ul class="nav-links">
                <li><a href="index.html">Sobre Mim</a></li>
                <li><a href="formacao.html">Formação</a></li>
                <li><a href="portfolio.html">Portfólio</a></li>
                <li><a href="contato.html" class="active">Contato</a></li>
            </ul>
            <button id="btn-tema" class="btn-tema">🌓 Alternar Tema</button>
        </nav>
    </header>

    <main class="container animate-fade">
        <section class="contato">
            <h1>Entre em Contato</h1>
            <p>Preencha os campos abaixo para me enviar uma mensagem direta.</p>

            <form id="formContato" class="form-estilizado">
                <div class="form-grupo">
                    <label for="nome">Nome Completo:</label>
                    <input type="text" id="nome" placeholder="Digite seu nome">
                </div>

                <div class="form-grupo">
                    <label for="email">E-mail de Contato:</label>
                    <input type="text" id="email" placeholder="exemplo@dominio.com">
                </div>

                <div class="form-grupo">
                    <label for="mensagem">Sua Mensagem:</label>
                    <textarea id="mensagem" rows="6" placeholder="Escreva sua mensagem aqui..."></textarea>
                </div>

                <button type="submit" class="btn-enviar">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 [Seu Nome Completo]. Todos os direitos reservados. Trabalho Prático UNINTER.</p>
    </footer>

     <script src="src/javascript/tema.js"></script>
    <script src="src/javascript/script.js"></script>
</body>
</html>
